spring:
    datasource:
        url: jdbc:clickhouse://clickhouse:8123/iot_platform
        driver-class-name: com.clickhouse.jdbc.ClickHouseDriver
        username: ${CLICKHOUSE_USER}
        password: ${CLICKHOUSE_PASSWORD}
    data:
        redis:
            host: redis
            port: 6379
            password: ${REDIS_PASSWORD}
    flyway:
        enabled: true

    kafka:
        bootstrap-servers: kafka:9092
        schema-registry:
            url: "http://schema-registry:8381"
        consumer:
            enable-auto-commit: false
            group-id: event-collector
            max-poll-records: 1
            manual: acknowledgment
            batch-listener: false
            topics:
                collect-device-event: events
        producer:
            max-retries: 4
            max-in-flight-requests-per-connection: 5
            max-block-ms: 8000
            topics:
                send-device-event: devices

events-collector-service:
    leader-election:
        name: "event-collector-service-leader-election-locks"
        expired-after-ms: 30000
    outbox:
        schedule:
            device-publisher-delay: PT1M

