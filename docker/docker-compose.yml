version: '2'

services:
    kafka:
        image: apache/kafka:4.2.0
        container_name: sc-kafka
        environment:
            # Переменные для запуска Kafka в режиме KRaft
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
            KAFKA_NUM_PARTITIONS: '12'
            KAFKA_COMPRESSION_TYPE: 'gzip'
            KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:19092
            KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_LOG_DIRS: /var/lib/kafka/data
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

        hostname: kafka
        ports:
            - "9092:9092"
            - "9093:9093"
            - "19092:19092"
        healthcheck:
            test: ["CMD-SHELL", "nc -vz localhost 9092"]
            interval: 15s
            timeout: 5s
            retries: 10

    schema-registry:
        image: confluentinc/cp-schema-registry:8.2.0
        container_name: sc-schema-registry
        hostname: schema-registry
        depends_on:
            - kafka
        environment:
            SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
            SCHEMA_REGISTRY_HOST_NAME: schema-registry
            SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
            SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
            SCHEMA_REGISTRY_LOG4J_ROOT_LOGLEVEL: INFO
        ports:
            - 8081:8081
        healthcheck:
            test: [ "CMD-SHELL", "curl -f http://localhost:8081/subjects" ]
            interval: 15s
            timeout: 5s
            retries: 10

    clickhouse:
        image: clickhouse/clickhouse-server:26.2
        container_name: sc-clickhouse
        ports:
            - "8123:8123"
            - "9000:9000"

        environment:
            CLICKHOUSE_DB: iot_platform
            CLICKHOUSE_USER: ${CLICKHOUSE_USER}
            CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
            CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        healthcheck:
            test: [ "CMD-SHELL", "clickhouse-client --query 'SELECT 1'" ]
            interval: 15s
            timeout: 5s
            retries: 10


    redis:
        image: redis:8.6.3-alpine
        container_name: redis
        ports:
            - "6379:6379"
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD}
        command: >
            redis-server 
            --save 60 1 
            --loglevel warning
            --requirepass ${REDIS_PASSWORD}
        restart: unless-stopped
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            interval: 15s
            timeout: 5s
            retries: 10



    kafka-ui:
        container_name: shcut-kafka-ui
        image: provectuslabs/kafka-ui:v0.7.2
        ports:
            - 9999:8080
        depends_on:
            - kafka
            - schema-registry
        environment:
            DYNAMIC_CONFIG_ENABLED: true
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
            KAFKA_CLUSTERS_0_SCHEMAREGISTRY: "http://schema-registry:8081"

    events-collector-service:
        build:
            context: ../events-collector-service
            dockerfile: Dockerfile
        container_name: events-collector-service
        environment:
            SPRING_PROFILES_ACTIVE: docker
            CLICKHOUSE_USER: ${CLICKHOUSE_USER}
            CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
            REDIS_PASSWORD: ${REDIS_PASSWORD}
        depends_on:
            clickhouse:
                condition: service_healthy
            redis:
                condition: service_healthy
            kafka:
                condition: service_healthy
            schema-registry:
                condition: service_healthy
        restart: unless-stopped

    schema-initializer:
        image: alpine/curl
        container_name: schema-initializer
        depends_on:
            - kafka
            - schema-registry
        volumes:
            - ./schemas:/schemas
            - ./init-schema.sh:/init-schema.sh
        command: >
            /bin/sh -c "
              apk add --no-cache jq &&
              chmod +x /init-schema.sh &&
              /init-schema.sh
            "
        restart: "no"

    kafka-init:
        image: confluentinc/cp-kafka:8.2.0
        container_name: kafka-init
        depends_on:
            - kafka
        command: >
            sh -c "
              echo 'Create topics...' &&
              kafka-topics --create --if-not-exists --topic devices --replication-factor 1 --partitions 3 --bootstrap-server kafka:9092 &&
              kafka-topics --create --if-not-exists --topic events --replication-factor 1 --partitions 3 --bootstrap-server kafka:9092 &&
              echo 'Done.'
            "
        restart: "no"