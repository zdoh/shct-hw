version: '2'

services:
    kafka:
        image: apache/kafka:4.2.0
        container_name: sc-kafka
        environment:
            # Переменные для запуска Kafka в режиме KRaft
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
            KAFKA_NUM_PARTITIONS: '12'
            KAFKA_COMPRESSION_TYPE: 'gzip'
            KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:19092
            KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_LOG_DIRS: /var/lib/kafka/data
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

        hostname: kafka
        ports:
            - "9092:9092"
            - "9093:9093"
            - "19092:19092"
        healthcheck:
            test: ["CMD-SHELL", "nc -vz localhost 9092"]
            interval: 15s
            timeout: 5s
            retries: 10

    schema-registry:
        image: confluentinc/cp-schema-registry:8.2.0
        container_name: sc-schema-registry
        hostname: schema-registry
        depends_on:
            - kafka
        environment:
            SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
            SCHEMA_REGISTRY_HOST_NAME: schema-registry
            SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8381
            SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
            SCHEMA_REGISTRY_LOG4J_ROOT_LOGLEVEL: INFO
        ports:
            - 8381:8381
        healthcheck:
            test: [ "CMD-SHELL", "curl -f http://localhost:8381/subjects" ]
            interval: 15s
            timeout: 5s
            retries: 10

    clickhouse:
        image: clickhouse/clickhouse-server:26.2
        container_name: sc-clickhouse
        ports:
            - "8123:8123"
            - "9000:9000"

        environment:
            CLICKHOUSE_DB: iot_platform
            CLICKHOUSE_USER: ${CLICKHOUSE_USER}
            CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
            CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        healthcheck:
            test: [ "CMD-SHELL", "clickhouse-client --query 'SELECT 1'" ]
            interval: 15s
            timeout: 5s
            retries: 10


    redis:
        image: redis:8.6.3-alpine
        container_name: redis
        ports:
            - "6379:6379"
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD}
        command: >
            redis-server 
            --save 60 1 
            --loglevel warning
            --requirepass ${REDIS_PASSWORD}
        restart: unless-stopped
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            interval: 15s
            timeout: 5s
            retries: 10



    kafka-ui:
        container_name: shcut-kafka-ui
        image: provectuslabs/kafka-ui:v0.7.2
        ports:
            - 9999:8080
        depends_on:
            - kafka
            - schema-registry
        environment:
            DYNAMIC_CONFIG_ENABLED: true
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
            KAFKA_CLUSTERS_0_SCHEMAREGISTRY: "http://schema-registry:8381"

    events-collector-service:
        build:
            context: ../events-collector-service
            dockerfile: Dockerfile
        container_name: events-collector-service
        environment:
            SPRING_PROFILES_ACTIVE: docker
            CLICKHOUSE_USER: ${CLICKHOUSE_USER}
            CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
            REDIS_PASSWORD: ${REDIS_PASSWORD}
        depends_on:
            clickhouse:
                condition: service_healthy
            redis:
                condition: service_healthy
            kafka:
                condition: service_healthy
            schema-registry:
                condition: service_healthy
        restart: unless-stopped
        labels:
            logging: "promtail"
        expose:
            - "8781"
            - "8780"
        ports:
            - 8781:8781
            - 8780:8780

    ### --- СЕРВИСЫ МОНИТОРИНГА  ---
    prometheus:
        image: prom/prometheus:latest
        container_name: prometheus
        volumes:
            - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
        ports:
            - "9090:9090"
        restart: unless-stopped

    loki:
        image: grafana/loki:latest
        container_name: loki
        ports:
            - "3100:3100"
        volumes:
            - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
        command: -config.file=/etc/loki/loki-config.yaml
        restart: unless-stopped

    alloy:
        image: grafana/alloy:latest
        container_name: alloy
        volumes:
            - ./config.alloy:/etc/alloy/config.alloy:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro  # для доступа к контейнерам (логи Docker)
            - /var/lib/docker/containers:/var/lib/docker/containers:ro  # файлы логов
        ports:
            - "12345:12345"   # внутренний HTTP-сервер Alloy для отладки
        command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
        restart: unless-stopped
        depends_on:
            - prometheus
            - loki

    grafana:
        image: grafana/grafana:latest
        container_name: grafana
        ports:
            - "3000:3000"
        environment:
            - GF_SECURITY_ADMIN_USER=admin
            - GF_SECURITY_ADMIN_PASSWORD=admin
            - GF_INSTALL_PLUGINS=grafana-clickhouse-datasource
        volumes:
            - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
        restart: unless-stopped
        depends_on:
            - prometheus
            - loki


    ### --- СЕРВИСЫ ДЛЯ ИНИЦИАЛИЗАЦИИ ---
    schema-initializer:
        image: alpine/curl
        container_name: schema-initializer
        depends_on:
            - kafka
            - schema-registry
        volumes:
            - ./schemas:/schemas
            - ./init-schema.sh:/init-schema.sh
        command: >
            /bin/sh -c "
              apk add --no-cache jq &&
              chmod +x /init-schema.sh &&
              /init-schema.sh
            "
        restart: "no"

    kafka-init:
        image: confluentinc/cp-kafka:8.2.0
        container_name: kafka-init
        depends_on:
            - kafka
        command: >
            sh -c "
              echo 'Create topics...' &&
              kafka-topics --create --if-not-exists --topic devices --replication-factor 1 --partitions 3 --bootstrap-server kafka:9092 &&
              kafka-topics --create --if-not-exists --topic events --replication-factor 1 --partitions 3 --bootstrap-server kafka:9092 &&
              echo 'Done.'
            "
        restart: "no"